name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - ci
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
        python-version: [3.11]
    
    steps:
      - uses: actions/checkout@v4
      
      # Setup Node.js for frontend tests
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      # Setup Python for backend tests
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      # Install frontend dependencies
      - name: Install frontend dependencies
        run: npm ci
      
      # Run frontend tests
      - name: Run frontend tests
        run: npm test -- --passWithNoTests
      
      # Install backend dependencies
      - name: Install backend dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt
      
      # Run backend tests
      - name: Run backend tests
        working-directory: ./backend
        run: pytest tests/ -v
  
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci')
    
    steps:
      - uses: actions/checkout@v4
      
      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      # Get current date for image tag
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
      
      # Build and push backend image
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/gamelab-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/gamelab-backend:${{ steps.date.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # Build and push frontend image
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/gamelab-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/gamelab-frontend:${{ steps.date.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
