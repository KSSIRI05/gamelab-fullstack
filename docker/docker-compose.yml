version: '3.9'

services:
  # Backend FastAPI avec SQLite
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: ${DOCKER_USERNAME:-gamelab}/gamelab-backend:${IMAGE_TAG:-latest}
    container_name: ${BACKEND_CONTAINER_NAME:-gamelab_backend}
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./gamelab.db}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-this-in-production}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ${BACKEND_VOLUME_TYPE:-./backend}:/app
      - sqlite_data:/app
    networks:
      - gamelab_network
    restart: ${RESTART_POLICY:-unless-stopped}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-10s}
      retries: ${HEALTHCHECK_RETRIES:-3}
      start_period: 10s

  # Frontend Next.js
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    image: ${DOCKER_USERNAME:-gamelab}/gamelab-frontend:${IMAGE_TAG:-latest}
    container_name: ${FRONTEND_CONTAINER_NAME:-gamelab_frontend}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gamelab_network
    restart: ${RESTART_POLICY:-unless-stopped}

volumes:
  sqlite_data:
    driver: local

networks:
  gamelab_network:
    driver: bridge
